# One container, five sites. The host nginx forwards the Host header, so each
# subdomain maps to its own build directory. The apex serves the docs, and so
# does anything unrecognised (the health check's 127.0.0.1).

map $host $rmk_site {
    default                          docs;
    mermaid.reactmarkdownkit.com     mermaid;
    slides.reactmarkdownkit.com      slides;
    renderer.reactmarkdownkit.com    renderer;
    editor.reactmarkdownkit.com      editor;
}

# The docs lived on docs.reactmarkdownkit.com until 2026-09-27, and www served
# a copy of the old home page. Both move permanently to the same path on the
# apex, in one hop, so search engines carry each page's ranking over. Keep
# these redirects for good. The two ownership files stay reachable without a
# redirect, so the old host stays verified in Google Search Console and Bing
# Webmaster Tools, which both need it verified to process the site move.
server {
    listen 80;
    server_name docs.reactmarkdownkit.com www.reactmarkdownkit.com;
    root /usr/share/nginx/html/docs;

    location = /googlec9e17fdcff1e9c06.html { try_files $uri =404; }
    location = /BingSiteAuth.xml { try_files $uri =404; }
    location / {
        return 301 https://reactmarkdownkit.com$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html/$rmk_site;
    index index.html;
    # Relative Location headers: this nginx only sees plain HTTP, and an
    # absolute http:// redirect would add a hop through the host's TLS upgrade.
    absolute_redirect off;

    # The old home page served these at the apex root; the docs keep them under /img/.
    location = /social-card.png { return 301 /img/social-card.png; }
    location = /logo.svg        { return 301 /img/logo.svg; }
    location = /favicon.svg     { return 301 /img/favicon.svg; }

    # Docusaurus and Vite both fingerprint their bundles under /assets/.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # Every route of every site is a file: the docs build one index.html per
    # route and each demo has the single route `/` (slides switches views with
    # `?view=`). An unknown path is a real 404, never the home page with a 200,
    # which search engines index as a soft 404. Each build ships a 404.html.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
