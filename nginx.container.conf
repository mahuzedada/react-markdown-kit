# One container, six sites. The host nginx forwards the Host header, so each
# subdomain maps to its own build directory. The apex and www serve the home
# page; anything unrecognised (the health check's 127.0.0.1) gets the docs.

map $host $rmk_site {
    default                          docs;
    reactmarkdownkit.com             home;
    www.reactmarkdownkit.com         home;
    mermaid.reactmarkdownkit.com     mermaid;
    slides.reactmarkdownkit.com      slides;
    renderer.reactmarkdownkit.com    renderer;
    editor.reactmarkdownkit.com      editor;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/$rmk_site;
    index index.html;

    # Docusaurus and Vite both fingerprint their bundles under /assets/.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # Every route of every site is a file: the docs build one index.html per
    # route and each demo has the single route `/` (slides switches views with
    # `?view=`). An unknown path is a real 404, never the home page with a 200,
    # which search engines index as a soft 404. Each build ships a 404.html.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
