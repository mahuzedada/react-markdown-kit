services:
  app:
    image: reactmarkdownkit:${IMAGE_TAG:-latest}
    container_name: reactmarkdownkit
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:9011:80"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
