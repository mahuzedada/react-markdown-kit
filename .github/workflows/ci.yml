name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures          # download the pinned CommonMark spec
      - run: pnpm build             # tests/compare-runner runs the packed CLI against dist
      - run: pnpm test
      - run: pnpm typecheck
      - run: node scripts/check-css-scope.mjs   # styling contract

  # Spec 12.2: never trust monorepo imports. Pack the real tarballs and install
  # them into clean consumers, so undeclared dependencies, broken exports and
  # missing types fail here rather than for a user.
  packaged-consumers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [npm, pnpm, yarn]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/pack-check.mjs ${{ matrix.client }}

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @react-markdown-kit/renderer build
      # Informational. CI machines are too noisy to gate on timing, so this
      # records numbers rather than failing a PR over them.
      - run: node benchmarks/run.mjs

  # The site build is also a real integration test: RenderExample,
  # TemplateExample and the demo pages' landing copy server-render with the
  # actual packages, so a renderer or a plugin that reached for a browser
  # global would fail here.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter react-markdown-kit-site build
      - name: Live examples must have server-rendered
        run: |
          grep -q "<table>" site/build/markdown-template-engine/index.html
          grep -q "Acme Industrial" site/build/markdown-template-engine/index.html
      # The slides page renders a deck on the server (a second <section> proves
      # the split) and imports the plugin stylesheet, which must reach the
      # built CSS: RenderExample loads no plugin CSS on its own.
      - name: The slides page server-rendered a deck with its stylesheet
        run: |
          grep -q 'data-rmk-slide="2"' site/build/docs/slides/index.html
          grep -q 'data-rmk-slide-body' site/build/assets/css/*.css
      # The SEO surface of the built site: one h1, title and description
      # lengths, canonical, Open Graph with a PNG, structured data, FAQPage
      # where there is an FAQ, robots, sitemap, llms.txt; then every href and
      # src inside the site and in the package READMEs resolves.
      - run: pnpm vitest run tests/seo-surface.test.ts tests/seo-links.test.ts
        env: { RMK_SITES_BUILT: '1' }   # here the site must be built; elsewhere an unbuilt site skips
      # One row per page (host, path, title, description length, h1, JSON-LD
      # types), so a reviewer can eyeball the deploy in the job log.
      - run: pnpm seo:report
